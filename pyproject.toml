[project]
name = "badass-runner"
version = "0.5.1"
description = "Securely connect private AI endpoints to BADASS Cloud for authorized behavioral security testing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "httpx>=0.28.0",
    "keyring>=24.0",
    "pydantic==2.12.5",
    "badass-runner-protocol==0.2.1",
]

[project.scripts]
badass-runner = "badass_runner.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["badass_runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

